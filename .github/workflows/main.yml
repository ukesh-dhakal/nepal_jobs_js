name: Nepal Jobs Alert

on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run scraper / notifier
        run: node notifier.js
        env:
          DISCORD_WEBHOOK_URL: ${{ https://discord.com/api/webhooks/1503045870172639495/7nZXV-UpO4LKYt84qoeYs0rIs4UtXACXguc8mxOackR0eDa08AXsmsub13XQxOsiFG0W }}
